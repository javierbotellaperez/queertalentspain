<!-- Hero Section en index.html -->
<header class="hero">
  <div class="hero__container">
    <h1 class="hero__title">Directorio Profesional Queer Talent Spain</h1>
    <p class="hero__subtitle">
      Visibilidad, red y comunidad para profesionales LGBTQ+ del sector audiovisual, musical y artes escénicas en España y Catalunya.
    </p>

    <!-- Botones de Acción (CTAs) -->
    <div class="hero__actions">
      <!-- Botón 1: Redirige al Google Form público en una pestaña nueva -->
      <a 
        href="https://docs.google.com/forms/d/1wnjXYf3uE_0WzQ4OfojwGoBkfUsjTsNeQ9aq2zfaJ58/viewform" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="btn btn--primary"
      >
        Sumarme al directorio
      </a>

      <!-- Botón 2: Hace scroll directo al buscador dentro de la misma página -->
      <a href="#directorio" class="btn btn--secondary">
        Buscar profesionales
      </a>
    </div>
  </div>
</header>

<!-- Sección del Directorio y Buscador -->
<main id="directorio" class="directory">
  <div class="directory__filters">
    <!-- Aquí van tu buscador por texto y selectores de CCAA / Categorías -->
  </div>

  <div id="profiles-grid" class="directory__grid">
    <!-- Renderizado dinámico desde JS -->
  </div>
</main>
