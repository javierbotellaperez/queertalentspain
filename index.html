<div class="filters">
  <!-- Búsqueda por texto libre -->
  <div class="filter-group filter-group--search">
    <input type="text" id="search-input" placeholder="Buscar por nombre, palabra clave, bio...">
  </div>

  <!-- Filtro por Puesto / Profesión Específica (Subcategorías) -->
  <div class="filter-group">
    <select id="role-filter">
      <option value="">Todas las profesiones</option>

      <optgroup label="Cine, TV y Audiovisual">
        <option value="Dirección / Realización">Dirección / Realización</option>
        <option value="Ayudante de Dirección">Ayudante de Dirección</option>
        <option value="Guion / Scriptwriter">Guion / Scriptwriter</option>
        <option value="Script / Continuista">Script / Continuista</option>
        <option value="Dirección de Producción">Dirección de Producción</option>
        <option value="Jefatura de Producción">Jefatura de Producción</option>
        <option value="Auxiliar de Producción">Auxiliar de Producción</option>
        <option value="Coordinación de Post Producción">Coordinación de Post Producción</option>
        <option value="Localizaciones (Location Manager / Scout)">Localizaciones (Location Manager / Scout)</option>
        <option value="Dirección de Fotografía (DoP)">Dirección de Fotografía (DoP)</option>
        <option value="Operador/a de Cámara">Operador/a de Cámara</option>
        <option value="Ayudante de Cámara (1st AC) / Auxiliar">Ayudante de Cámara (1st AC)</option>
        <option value="Gaffer / Jefatura de Eléctricos">Gaffer / Jefatura de Eléctricos</option>
        <option value="Eléctrico/a">Eléctrico/a</option>
        <option value="Maquinista (Grip)">Maquinista (Grip)</option>
        <option value="Dirección de Arte">Dirección de Arte</option>
        <option value="Diseño de Vestuario">Diseño de Vestuario</option>
        <option value="Estilismo / Maquillaje y Peluquería de Cine">Maquillaje / Peluquería Cine</option>
        <option value="Atrezzo / Ambientación">Atrezzo / Ambientación</option>
        <option value="Sonidista / Técnico/a de Sonido Directo">Sonidista / Sonido Directo</option>
        <option value="Microfonista">Microfonista</option>
        <option value="Montaje / Edición">Montaje / Edición</option>
        <option value="Colorista">Colorista</option>
        <option value="Diseño de Sonido / Edición de Audio">Diseño de Sonido</option>
        <option value="VFX / Postproducción Visual">VFX / Postproducción Visual</option>
      </optgroup>

      <optgroup label="Música y Producción Sonora">
        <option value="Cantante / Vocalista">Cantante / Vocalista</option>
        <option value="Músico/a / Instrumentista">Músico/a / Instrumentista</option>
        <option value="Composición / Songwriting">Composición / Songwriting</option>
        <option value="Producción Musical">Producción Musical</option>
        <option value="DJ / Selector/a">DJ / Selector/a</option>
        <option value="Ingeniería de Grabación / Mezcla / Masterización">Ingeniería de Grabación / Mezcla</option>
        <option value="Técnico/a de Sonido Directo (PA / Monitores)">Técnico/a Sonido Directo</option>
        <option value="Tour Manager / Gestión de Giras">Tour Manager</option>
      </optgroup>

      <optgroup label="Danza y Artes Escénicas">
        <option value="Bailarín/a / Performer">Bailarín/a / Performer</option>
        <option value="Coreografía">Coreografía</option>
        <option value="Dirección Escénica / Teatral">Dirección Escénica / Teatral</option>
        <option value="Dramaturgia">Dramaturgia</option>
        <option value="Intérprete / Actor / Actriz de Teatro">Intérprete / Actor / Actriz</option>
        <option value="Dirección Técnica de Espacio Escénico">Dirección Técnica Escénica</option>
      </optgroup>

      <optgroup label="Otras Áreas Creativas">
        <option value="Fotografía (Moda, Retrato, Fijo)">Fotografía (Moda, Retrato, Fijo)</option>
        <option value="Diseño Gráfico / Ilustración">Diseño Gráfico / Ilustración</option>
        <option value="Maquillaje Y Peluquería / Drag Arts">Maquillaje / Drag Arts</option>
        <option value="Gestión Cultural / Booking / Comisariado">Gestión Cultural / Booking</option>
      </optgroup>
    </select>
  </div>

  <!-- Filtro por CCAA -->
  <div class="filter-group">
    <select id="ccaa-filter">
      <option value="">Todas las CCAA</option>
      <option value="Andalucía">Andalucía</option>
      <option value="Aragón">Aragón</option>
      <option value="Asturias">Asturias</option>
      <option value="Baleares">Baleares</option>
      <option value="Canarias">Canarias</option>
      <option value="Cantabria">Cantabria</option>
      <option value="Castilla y León">Castilla y León</option>
      <option value="Castilla-La Mancha">Castilla-La Mancha</option>
      <option value="Catalunya">Catalunya</option>
      <option value="Comunitat Valenciana">Comunitat Valenciana</option>
      <option value="Extremadura">Extremadura</option>
      <option value="Galicia">Galicia</option>
      <option value="La Rioja">La Rioja</option>
      <option value="Madrid">Madrid</option>
      <option value="Murcia">Murcia</option>
      <option value="Navarra">Navarra</option>
      <option value="País Vasco">País Vasco</option>
      <option value="Ceuta / Melilla">Ceuta / Melilla</option>
      <option value="Internacional / Remoto">Internacional / Remoto</option>
    </select>
  </div>

  <!-- Checkbox para Disponibilidad Remota -->
  <div class="filter-group filter-group--checkbox">
    <label class="checkbox-container">
      <input type="checkbox" id="remote-filter">
      <span class="checkmark"></span>
      <span class="checkbox-label">💻 Disponible en remoto</span>
    </label>
  </div>
</div>
