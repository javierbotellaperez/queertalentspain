<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queer Talent Spain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <h1>Queer Talent Spain</h1>
    <p>Directorio profesional público de visibilidad LGBTQ+.</p>
    <div class="hero__actions">
      <a href="https://docs.google.com/forms/d/1wnjXYf3uE_0WzQ4OfojwGoBkfUsjTsNeQ9aq2zfaJ58/viewform" target="_blank" class="btn btn--primary">Sumarme al directorio</a>
      <a href="#directorio" class="btn btn--secondary">Buscar profesionales</a>
    </div>
  </header>

  <!-- Buscador y Filtros -->
  <section id="directorio" class="directory">
    <div class="filters">
      <input type="text" id="search-input" placeholder="Buscar por nombre, disciplina...">
      <select id="ccaa-filter">
        <option value="">Todas las CCAA</option>
        <option value="Catalunya">Catalunya</option>
        <option value="Madrid">Madrid</option>
        <!-- Resto de CCAA -->
      </select>
    </div>

    <!-- Grid de tarjetas -->
    <div id="grid-profiles" class="grid"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
